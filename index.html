<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookflix definitivo</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body{background:#141414;color:white;font-family:sans-serif}
.stat-card{background:#1a1a1a;border:1px solid #333;border-radius:1rem;padding:1rem}
.bingo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bingo-cell{border:1px solid #333;padding:10px;text-align:center}
</style>
</head>

<body>
<h1 class="text-4xl text-center my-6">🎬 BOOKFLIX DEFINITIVO</h1>

<div class="stat-card">
<h2>🧡 Estantería</h2>
<div id="shelfGrid"></div>
</div>

<div class="stat-card mt-6">
<h2>🎯 Bingo</h2>
<div id="bingoGrid" class="bingo-grid"></div>
</div>

<div class="stat-card mt-6">
<h2>📅 Calendario</h2>
<div id="calendarContainer"></div>
</div>

<script>
const firebaseConfig = {
apiKey:"AIzaSyB9HfOE1_Ow0kRgULnq_AtNxxvU5W13W7s",
authDomain:"bookflix-1c78e.firebaseapp.com",
projectId:"bookflix-1c78e",
storageBucket:"bookflix-1c78e.firebasestorage.app",
messagingSenderId:"290289108854",
appId:"1:290289108854:web:4585c29feeab7ac2ccdc57"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const BINGO_CHALLENGES=[
{id:'1',text:'+500 páginas'},
{id:'2',text:'Premio literario'},
{id:'3',text:'Otro continente'},
{id:'4',text:'Romance'},
{id:'5',text:'Teatro'}
];

let appData={books:[]};

async function loadBooksFromFirebase(){
const snapshot=await db.collection("books").get();
appData.books=snapshot.docs.map(d=>({...d.data(),id:d.id}));
initAllUI();
}

function initShelf(){
const grid=document.getElementById("shelfGrid");
grid.innerHTML=appData.books.map(b=>`
<div>${b.title} - ${b.author}</div>
`).join("");
}

function initBingo(){
const grid=document.getElementById("bingoGrid");
grid.innerHTML=BINGO_CHALLENGES.map(c=>{
const done=appData.books.some(b=>(b.bingoIds||[]).includes(c.id));
return `<div class="bingo-cell">${c.text} ${done?'✅':''}</div>`;
}).join("");
}

function initCalendar(){
document.getElementById("calendarContainer").innerHTML="Calendario activo ✅";
}

function initAllUI(){
initShelf();
initBingo();
initCalendar();
}

document.addEventListener("DOMContentLoaded",loadBooksFromFirebase);
</script>

</body>
</html>
