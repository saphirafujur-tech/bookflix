<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookflix</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0b0b0b;
color:white;
}

header{
text-align:center;
padding:30px;
}

header h1{
color:#ff1e3c;
font-size:48px;
margin:0;
}

.section{
padding:20px 40px;
}

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.card{
background:#1a1a1a;
padding:20px;
border-radius:12px;
flex:1;
min-width:150px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}

#shelf{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.book{
width:140px;
background:#1a1a1a;
border-radius:10px;
overflow:hidden;
}

.book img{
width:100%;
height:200px;
object-fit:cover;
}

.book-title{
padding:8px;
font-size:14px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
gap:15px;
}

.bingo{
background:#1a1a1a;
padding:20px;
border-radius:10px;
text-align:center;
}

input,button{
padding:8px;
margin:5px;
border-radius:6px;
border:none;
}

button{
background:#ff1e3c;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>🎬 BOOKFLIX</h1>
<p>Tu biblioteca personal</p>
</header>

<div class="section">
<h2>📊 Dashboard</h2>
<div class="cards">
<div class="card"><h3 id="totalBooks">0</h3><p>Libros</p></div>
<div class="card"><h3>0</h3><p>Páginas</p></div>
<div class="card"><h3>0.0</h3><p>Valoración</p></div>
</div>
</div>

<div class="section">
<h2>❤️ Estantería</h2>

<form onsubmit="addBook(event)">
<input id="title" placeholder="Título" required>
<input id="cover" placeholder="URL portada">
<button>Añadir</button>
</form>

<div id="shelf"></div>
</div>

<div class="section">
<h2>🎯 Bingo Literario</h2>
<div class="grid">
<div class="bingo">+500 páginas</div>
<div class="bingo">Clásico</div>
<div class="bingo">Sci‑Fi</div>
<div class="bingo">Misterio</div>
<div class="bingo">Romance</div>
<div class="bingo">No ficción</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"TU_API_KEY",
authDomain:"TU_PROYECTO.firebaseapp.com",
projectId:"TU_PROYECTO",
storageBucket:"TU_PROYECTO.appspot.com",
messagingSenderId:"XXXX",
appId:"XXXX"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function addBook(e){
e.preventDefault();
const title=document.getElementById("title").value;
const cover=document.getElementById("cover").value;

db.collection("books").add({
title,
cover,
createdAt:new Date()
});

e.target.reset();
}

db.collection("books").orderBy("createdAt","desc")
.onSnapshot(snapshot=>{
const shelf=document.getElementById("shelf");
shelf.innerHTML="";
let count=0;

snapshot.forEach(doc=>{
const b=doc.data();
count++;

shelf.innerHTML+=`
<div class="book">
<img src="${b.cover || 'https://via.placeholder.com/150x200?text=Libro'}">
<div class="book-title">${b.title}</div>
</div>
`;
});

document.getElementById("totalBooks").textContent=count;
});
</script>

</body>
</html>
