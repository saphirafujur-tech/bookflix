<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookflix Firebase</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#141414;color:white;font-family:sans-serif">

<h1 style="color:#e50914;font-size:48px;text-align:center;margin-top:30px;">🎬 BOOKFLIX</h1>

<div style="max-width:900px;margin:auto;padding:20px">
<button onclick="addDemo()" style="background:#e50914;padding:10px;border-radius:8px">Añadir libro demo</button>
<div id="books"></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB9HfOE1_Ow0kRgULnq_AtNxxvU5W13W7s",
  authDomain: "bookflix-1c78e.firebaseapp.com",
  projectId: "bookflix-1c78e",
  storageBucket: "bookflix-1c78e.appspot.com",
  messagingSenderId: "290289108854",
  appId: "1:290289108854:web:4585c29feeab7ac2ccdc57"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let appData = { books: [] };

async function loadBooksFromFirebase(){
  const snap = await db.collection("books").orderBy("created_at","desc").get();
  appData.books = snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
}

async function addDemo(){
  await db.collection("books").add({
    title:"Libro prueba",
    author:"Noemí",
    created_at:new Date()
  });
  loadBooksFromFirebase();
}

function render(){
  const c=document.getElementById("books");
  if(!appData.books.length){
    c.innerHTML="<p>No hay libros aún</p>";
    return;
  }
  c.innerHTML=appData.books.map(b=>`
    <div style="background:#1a1a1a;padding:15px;margin-top:10px;border-radius:10px">
      <b>${b.title}</b><br>${b.author}
    </div>
  `).join("");
}

document.addEventListener("DOMContentLoaded",loadBooksFromFirebase);
</script>

</body>
</html>
