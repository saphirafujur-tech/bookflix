<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BOOKFLIX 2026</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{font-family:Montserrat}
body{background:#141414;color:white}
h1,h2,h3{font-family:"Bebas Neue";letter-spacing:2px}
.stat-card{
background:linear-gradient(135deg,#2a2a2a,#1a1a1a);
border:1px solid #333;
border-radius:1rem;
padding:1.5rem;
}
.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 30px rgba(229,9,20,.3);
}
.shelf-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
gap:14px;
}
.shelf-item{
background:#1a1a1a;
border:1px solid #333;
border-radius:14px;
overflow:hidden;
cursor:pointer;
}
.shelf-cover{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
}
</style>
</head>

<body class="p-6">

<header class="text-center mb-10">
<h1 class="text-7xl text-red-600">🎬 BOOKFLIX</h1>
<p>Tu biblioteca personal 2026</p>
</header>

<div class="max-w-6xl mx-auto">

<div class="stat-card mb-8">
<h2 class="text-3xl mb-4">📚 Añadir libro</h2>

<input id="title" placeholder="Título"
class="w-full mb-2 p-2 bg-black">

<input id="author" placeholder="Autor"
class="w-full mb-2 p-2 bg-black">

<input id="pages" type="number"
placeholder="Páginas"
class="w-full mb-2 p-2 bg-black">

<input id="cover"
placeholder="URL portada"
class="w-full mb-4 p-2 bg-black">

<button onclick="saveBook()"
class="bg-red-600 px-6 py-2 rounded font-bold">
Guardar libro
</button>
</div>

<h2 class="text-4xl mb-6">🧡 Estantería</h2>
<div id="shelfGrid" class="shelf-grid"></div>

</div>
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyB9HfOE1_Ow0kRgULnq_AtNxxvU5W13W7s",
authDomain:"bookflix-1c78e.firebaseapp.com",
projectId:"bookflix-1c78e",
storageBucket:"bookflix-1c78e.firebasestorage.app",
messagingSenderId:"290289108854",
appId:"1:290289108854:web:4585c29feeab7ac2ccdc57"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let editingId=null;

/* LOAD */

async function loadBooks(){

const snap=await db
.collection("books")
.orderBy("created_at","desc")
.get();

const grid=document.getElementById("shelfGrid");

grid.innerHTML=snap.docs.map(doc=>{

const b=doc.data();

return`
<div class="shelf-item">

${b.cover_url?
`<img src="${b.cover_url}" class="shelf-cover">`
:`<div class="shelf-cover flex items-center justify-center">Sin portada</div>`
}

<div class="p-2">
<div class="font-bold">${b.title}</div>
<div class="text-sm text-gray-400">${b.author}</div>

<button onclick="editBook('${doc.id}')">✏️</button>
<button onclick="deleteBook('${doc.id}')">🗑️</button>
</div>

</div>
`;

}).join("");

}

/* SAVE */

async function saveBook(){

const book={
title:title.value,
author:author.value,
pages:Number(pages.value)||0,
cover_url:cover.value,
created_at:new Date()
};

if(editingId){

await db.collection("books")
.doc(editingId)
.update(book);

editingId=null;

}else{

await db.collection("books")
.add(book);

}

title.value="";
author.value="";
pages.value="";
cover.value="";

loadBooks();
}

/* EDIT */

async function editBook(id){

const doc=await db.collection("books").doc(id).get();
const b=doc.data();

title.value=b.title;
author.value=b.author;
pages.value=b.pages;
cover.value=b.cover_url;

editingId=id;
}

/* DELETE */

async function deleteBook(id){

if(!confirm("Eliminar libro?"))return;

await db.collection("books")
.doc(id)
.delete();

loadBooks();
}

loadBooks();

</script>

</body>
</html>
